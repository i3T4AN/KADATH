[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kadath"
version = "0.1.0"
description = "Kernel for Agentic Darwinian Adaptation, Tooling, and Heredity"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34", "psycopg[binary]>=3.2", "psycopg_pool>=3.2", "Pillow>=11", "PyMuPDF>=1.25"]

[project.scripts]
kadath = "kadath.cli:main"

[tool.setuptools.packages.find]
include = ["kadath*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
