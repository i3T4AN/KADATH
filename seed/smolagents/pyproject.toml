[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "smolagents"
version = "1.27.0.dev0"
description = "KADATH's editable smolagents organism seed"
requires-python = ">=3.10"
dependencies = [
  "huggingface-hub>=0.31.2",
  "requests>=2.32.3",
  "rich>=13.9.4",
  "jinja2>=3.1.4",
  "pillow>=10.0.1",
  "python-dotenv",
]

[project.optional-dependencies]
litellm = ["litellm>=1.60.2"]
mcp = ["mcpadapt>=0.1.20", "mcp>=1.10.1,<2"]

[tool.setuptools.package-data]
"smolagents.prompts" = ["*.yaml"]
